[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smbrag"
version = "0.1.0"
description = "RAG-ассистент по документации для малого бизнеса: подготовка контекста, сопоставление сущностей, Qwen, golden dataset и метрики качества"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "beautifulsoup4>=4.12",
  "pypdf>=4.0",
  "pyyaml>=6.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "rank-bm25>=0.2.2",
  "snowballstemmer>=2.2",
  "rapidfuzz>=3.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
gpu = ["torch", "transformers>=4.51", "accelerate>=0.30", "sentence-transformers>=3.0", "bitsandbytes>=0.43"]
api = ["openai>=1.30"]
dev = ["pytest>=8.0", "pandas>=2.0"]

[project.scripts]
smbrag = "smbrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
